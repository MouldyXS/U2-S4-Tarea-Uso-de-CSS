<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/estilos.css">

    <title>Registro</title>

</head>

<body class="wrapper"> 
<header>
  <h1>Mi primer sitio web</h1>
        <nav>

                    <a href="index.html" >Inicio</a>

                    <a href="acerca.html" >Acerca de</a>

                    <a href="servicios.html" >Servicios</a>

                    <a href="contacto.html" >Contacto</a>

                    <a href="registro.html" >Registro</a>    
        </nav>
</header>

    
    <main>
<section class="registro">

<form>
    <h2>Registro de usuario</h2>
    <p>Crea tu cuenta para acceder a los servicios</p>

    <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required minlength="3">
    </div>

    <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6">
    </div>

    <div class="form-group">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" required minlength="6">
    </div>

    <div class="form-group">
        <label>Género</label>
        <div class="radio-group">
            <label><input type="radio" name="genero" value="masculino" required> Masculino</label>
            <label><input type="radio" name="genero" value="femenino"> Femenino</label>
        </div>
    </div>

    <div class="form-group">
        <label for="pais">País</label>
<select id="pais" name="pais" required>
    <option value="">Selecciona un país</option>

    <optgroup label="América">
        <option value="ecuador">Ecuador</option>
        <option value="argentina">Argentina</option>
        <option value="colombia">Colombia</option>
        <option value="peru">Perú</option>
        <option value="chile">Chile</option>
        <option value="mexico">México</option>
        <option value="estados_unidos">Estados Unidos</option>
        <option value="canada">Canadá</option>
    </optgroup>

    <optgroup label="Europa">
        <option value="espana">España</option>
        <option value="francia">Francia</option>
        <option value="alemania">Alemania</option>
        <option value="italia">Italia</option>
        <option value="reino_unido">Reino Unido</option>
    </optgroup>

    <optgroup label="Asia">
        <option value="china">China</option>
        <option value="japon">Japón</option>
        <option value="corea_sur">Corea del Sur</option>
        <option value="india">India</option>
    </optgroup>

    <optgroup label="Otros">
        <option value="australia">Australia</option>
        <option value="sudafrica">Sudáfrica</option>
    </optgroup>
</select>
    </div>

    <p class="nota">Todos los campos son obligatorios</p>

    <div class="form-group checkbox">
        <label>
            <input type="checkbox" required>
            Acepto los términos y condiciones
        </label>
    </div>

    <button type="submit">Crear cuenta</button>
</form>

</section>
    </main>

    <footer>
        <p> &copy; 2026 Mi primer sitio web. Todos los derechos reservados.</p>

    </footer>

</body>

</html>
