<!DOCTYPE html>

    <link rel="stylesheet" href="css/estilos.css">

<body class="wrapper">
    <header>
        <h1>Mi primer sitio web </h1>
        <nav>

                    <a href="index.html" >Inicio</a>

                    <a href="acerca.html" >Acerca de</a>

                    <a href="contacto.html" >Contacto</a>

        </nav>

<main class="contenido">

    <section class="contacto">
        <h2>Contáctame</h2>
        <p class="subtitulo">¿Tienes alguna duda o proyecto en mente? Escríbeme.</p>

        <form action="" method="post">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="Tu correo electrónico">
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" required placeholder="Escribe tu mensaje"></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>

        </form>
    </section>

</main>

     <footer>
        <p> &copy; 2026 Mi primer sitio web. Todos los derechos reservados.</p>

    </footer>
